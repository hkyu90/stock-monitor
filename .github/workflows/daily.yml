name: 일일 주식 모니터링 리포트

on:
  schedule:
    # 08:00 KST = 23:00 UTC (전날). PC 전원과 무관하게 GitHub 클라우드에서 실행.
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행(테스트)용

permissions:
  contents: write          # 생성된 리포트를 repo에 커밋하기 위해 필요

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 일일 리포트 생성
        env:
          # 클라우드에서는 iCloud 볼트가 없으므로 repo 내 vault/ 폴더로 출력
          STOCK_MONITOR_VAULT: ${{ github.workspace }}/vault
        run: python main.py daily

      - name: 리포트 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/
          if git diff --staged --quiet; then
            echo "변경된 리포트 없음 — 커밋 생략"
          else
            git commit -m "report: $(date -u +%Y-%m-%d) 일일 주식 모니터링 리포트 (자동)"
            git push
          fi
